<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtor</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div
      class="app-shell flex flex-col min-h-screen items-center justify-center p-6"
      x-data="authApp()"
      x-cloak
    >
      <h1>Realtor Field Agent</h1>
      <!-- ============ Loading / auth-check splash ============ -->
      <div
        x-show="view === 'loading'"
        x-transition.opacity
        class="flex flex-col items-center gap-4 text-teal-300/80"
      >
        <div
          class="h-10 w-10 animate-spin rounded-full border-2 border-teal-400/30 border-t-teal-300"
        ></div>
        <p class="text-sm tracking-wide">Checking session&hellip;</p>
      </div>

      <!-- ============ Login screen ============ -->
      <div
        x-show="view === 'login'"
        x-transition.opacity.duration.300ms
        class="glass-card w-full max-w-sm rounded-3xl p-8 sm:p-10"
      >
        <div class="mb-8 flex flex-col items-center text-center">
          <div
            class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-teal-300 to-teal-600 shadow-lg shadow-teal-500/30"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#04201c"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="h-7 w-7"
            >
              <path d="M3 11.5 12 4l9 7.5" />
              <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
            </svg>
          </div>
          <h1 class="text-xl font-semibold tracking-tight text-white">
            Realtor Field Agent
          </h1>
          <p class="mt-1 text-sm text-slate-400">
            Sign in to start a client intake session
          </p>
        </div>

        <form class="space-y-5" @submit.prevent="submitLogin()">
          <div>
            <label
              for="email"
              class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400"
              >Email</label
            >
            <input
              id="email"
              type="email"
              autocomplete="username"
              inputmode="email"
              required
              x-model="email"
              :disabled="loading"
              placeholder="agent@example.com"
              class="field-input w-full rounded-xl px-4 py-3 text-sm text-white placeholder:text-slate-500"
            />
          </div>

          <div>
            <label
              for="password"
              class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400"
              >Password</label
            >
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
              x-model="password"
              :disabled="loading"
              placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
              class="field-input w-full rounded-xl px-4 py-3 text-sm text-white placeholder:text-slate-500"
            />
          </div>

          <div class="flex items-center justify-between pt-1">
            <button
              type="button"
              class="flex items-center gap-2 text-sm text-slate-300"
              @click="remember = !remember"
              :disabled="loading"
            >
              <span
                class="toggle-track relative inline-flex h-5 w-9 items-center rounded-full"
                :class="remember ? 'bg-teal-400/80' : 'bg-slate-600/60'"
              >
                <span
                  class="toggle-thumb inline-block h-3.5 w-3.5 transform rounded-full bg-white shadow"
                  :class="remember ? 'translate-x-[18px]' : 'translate-x-[3px]'"
                ></span>
              </span>
              Remember me
            </button>
          </div>

          <!-- Inline error for failed login (401 / 422 / network) -->
          <div
            x-show="error"
            x-transition.opacity
            x-text="error"
            class="rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-2.5 text-sm text-rose-300"
          ></div>

          <button
            type="submit"
            :disabled="loading"
            class="btn-primary flex w-full items-center justify-center gap-2 rounded-xl px-4 py-3 text-sm font-semibold"
          >
            <svg
              x-show="loading"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              class="h-4 w-4 animate-spin"
              fill="none"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4z"
              ></path>
            </svg>
            <span x-text="loading ? 'Signing in…' : 'Sign in'"></span>
          </button>
        </form>

        <p class="mt-6 text-center text-xs text-slate-500">
          Connecting to your organization's Realtor server
        </p>
      </div>

      <!-- ============ Authenticated app: client dashboard + intake wizard ============ -->
      <div
        x-show="view === 'app'"
        x-transition.opacity.duration.300ms
        x-data="clientWorkspace()"
        class="flex w-full max-w-md flex-col gap-4"
      >
        <!-- Header: identity, sync status, logout -->
        <div class="glass-card flex items-center justify-between rounded-3xl p-4 sm:p-5">
          <div class="min-w-0">
            <p class="text-[11px] uppercase tracking-wider text-slate-500">
              Field officer
            </p>
            <p
              class="truncate text-sm font-medium text-white"
              x-text="user?.name || user?.email || 'Signed in'"
            ></p>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <button
              type="button"
              @click="triggerSyncNow()"
              class="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-medium transition"
              :class="{
                'bg-sky-400/15 text-sky-300': syncSummary.state === 'syncing',
                'bg-amber-400/15 text-amber-300': syncSummary.state !== 'syncing' && (syncSummary.pendingCount > 0 || syncSummary.failedCount > 0),
                'bg-teal-400/15 text-teal-300': syncSummary.state !== 'syncing' && syncSummary.pendingCount === 0 && syncSummary.failedCount === 0 && syncSummary.state !== 'offline',
                'bg-slate-500/15 text-slate-400': syncSummary.state === 'offline' && syncSummary.pendingCount === 0 && syncSummary.failedCount === 0,
              }"
              :title="syncSummary.lastError || ''"
            >
              <span
                class="h-1.5 w-1.5 rounded-full bg-current"
                :class="syncSummary.state === 'syncing' ? 'animate-pulse' : ''"
              ></span>
              <span x-show="syncSummary.state === 'syncing'">Syncing&hellip;</span>
              <span x-show="syncSummary.state === 'offline' && syncSummary.pendingCount === 0 && syncSummary.failedCount === 0">Offline</span>
              <span x-show="syncSummary.state !== 'syncing' && syncSummary.failedCount > 0" x-text="syncSummary.failedCount + ' sync error' + (syncSummary.failedCount === 1 ? '' : 's')"></span>
              <span x-show="syncSummary.state !== 'syncing' && syncSummary.failedCount === 0 && syncSummary.pendingCount > 0" x-text="syncSummary.pendingCount + ' pending'"></span>
              <span x-show="syncSummary.state !== 'syncing' && syncSummary.failedCount === 0 && syncSummary.pendingCount === 0 && syncSummary.state !== 'offline'">All synced</span>
            </button>
            <button
              type="button"
              @click="logoutAction()"
              :disabled="loading"
              class="rounded-full border border-slate-600/60 px-3 py-1.5 text-xs font-medium text-slate-300 transition hover:border-rose-400/40 hover:text-rose-300 disabled:opacity-60"
            >
              <span x-text="loading ? '…' : 'Sign out'"></span>
            </button>
          </div>
        </div>

        <!-- ============ Dashboard: local client list ============ -->
        <template x-if="screen === 'dashboard'">
          <div class="glass-card max-h-[75vh] overflow-y-auto rounded-3xl p-5 sm:p-6">
            <div class="mb-5 flex items-center justify-between">
              <h2 class="text-base font-semibold text-white">Your clients</h2>
              <button
                type="button"
                @click="startNewClient()"
                class="btn-primary rounded-xl px-3.5 py-2 text-xs font-semibold"
              >
                + New client
              </button>
            </div>

            <p x-show="loadingClients" class="text-sm text-slate-500">Loading&hellip;</p>
            <p
              x-show="!loadingClients && clients.length === 0"
              class="rounded-xl border border-dashed border-slate-600/50 px-4 py-8 text-center text-sm text-slate-500"
            >
              No clients yet. Start a new intake to create your first draft —
              it saves locally immediately, even offline.
            </p>

            <ul class="divide-y divide-white/5">
              <template x-for="c in clients" :key="c.local_id">
                <li class="flex items-center justify-between gap-3 py-3">
                  <button
                    type="button"
                    @click="resumeClient(c.local_id)"
                    class="min-w-0 flex-1 text-left"
                  >
                    <p
                      class="truncate text-sm font-medium text-white"
                      x-text="(c.first_name + ' ' + c.surname).trim() || 'Untitled client'"
                    ></p>
                    <p class="truncate text-xs text-slate-500" x-text="c.phone_no || 'No phone number yet'"></p>
                  </button>
                  <span
                    class="shrink-0 rounded-full px-2.5 py-1 text-[11px] font-medium"
                    :class="syncBadge(c).className"
                    x-text="syncBadge(c).label"
                  ></span>
                  <button
                    type="button"
                    @click="removeClient(c.local_id)"
                    class="shrink-0 text-slate-500 transition hover:text-rose-300"
                    title="Delete draft"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                      <path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    </svg>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </template>

        <!-- ============ Wizard: step-by-step client intake ============ -->
        <template x-if="screen === 'wizard' && core">
          <div class="glass-card max-h-[80vh] overflow-y-auto rounded-3xl p-5 sm:p-6">
            <!-- Step progress -->
            <div class="mb-6 flex items-center justify-between gap-1">
              <template x-for="(label, i) in wizardSteps" :key="i">
                <button
                  type="button"
                  @click="goStep(i)"
                  class="flex flex-1 flex-col items-center gap-1.5 text-center"
                >
                  <span
                    class="flex h-7 w-7 items-center justify-center rounded-full text-xs font-semibold transition"
                    :class="i === wizardStep ? 'bg-teal-400 text-ink-950' : i < wizardStep ? 'bg-teal-400/25 text-teal-300' : 'bg-white/5 text-slate-500'"
                    x-text="i + 1"
                  ></span>
                  <span
                    class="hidden text-[10px] leading-tight sm:block"
                    :class="i === wizardStep ? 'text-teal-300' : 'text-slate-500'"
                    x-text="label"
                  ></span>
                </button>
              </template>
            </div>

            <div
              x-show="wizardError"
              x-text="wizardError"
              class="mb-4 rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-2.5 text-sm text-rose-300"
            ></div>

            <!-- Step 0: core client info -->
            <div x-show="wizardStep === 0" class="space-y-4">
              <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">First name *</label>
                  <input x-model="core.first_name" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                  <p x-show="coreErrors.first_name" x-text="coreErrors.first_name" class="mt-1 text-xs text-rose-300"></p>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Middle name</label>
                  <input x-model="core.middle_name" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Surname *</label>
                  <input x-model="core.surname" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                  <p x-show="coreErrors.surname" x-text="coreErrors.surname" class="mt-1 text-xs text-rose-300"></p>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Phone *</label>
                  <input x-model="core.phone_no" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                  <p x-show="coreErrors.phone_no" x-text="coreErrors.phone_no" class="mt-1 text-xs text-rose-300"></p>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Email</label>
                  <input x-model="core.email" type="email" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                  <p x-show="coreErrors.email" x-text="coreErrors.email" class="mt-1 text-xs text-rose-300"></p>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Account number</label>
                  <input x-model="core.account_number" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Date of birth</label>
                  <input x-model="core.dob" type="date" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Sex</label>
                  <select x-model="core.sex" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white">
                    <option value="">—</option>
                    <template x-for="opt in sexOptions" :key="opt.value">
                      <option :value="opt.value" x-text="opt.label"></option>
                    </template>
                  </select>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Marital status</label>
                  <select x-model="core.marital_status" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white">
                    <option value="">—</option>
                    <template x-for="opt in maritalStatusOptions" :key="opt.value">
                      <option :value="opt.value" x-text="opt.label"></option>
                    </template>
                  </select>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Nationality</label>
                  <input x-model="core.nationality" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">State</label>
                  <select x-model.number="core.state_id" @change="onStateChange()" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white">
                    <option value="">—</option>
                    <template x-for="s in states" :key="s.id">
                      <option :value="s.id" x-text="s.name"></option>
                    </template>
                  </select>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">City</label>
                  <select x-model.number="core.city_id" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white">
                    <option value="">—</option>
                    <template x-for="c in cities" :key="c.id">
                      <option :value="c.id" x-text="c.name"></option>
                    </template>
                  </select>
                </div>
                <div class="col-span-2">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Residential address</label>
                  <textarea x-model="core.residential_address" rows="2" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                </div>
                <div class="col-span-2">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Employer name &amp; address</label>
                  <textarea x-model="core.employer_name_address" rows="2" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Means of ID</label>
                  <select x-model="core.means_of_identification" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white">
                    <option value="">—</option>
                    <template x-for="opt in meansOfIdOptions" :key="opt.value">
                      <option :value="opt.value" x-text="opt.label"></option>
                    </template>
                  </select>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">ID number</label>
                  <input x-model="core.id_number" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">NIN (11 digits)</label>
                  <input x-model="core.nin" maxlength="11" inputmode="numeric" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                  <p x-show="coreErrors.nin" x-text="coreErrors.nin" class="mt-1 text-xs text-rose-300"></p>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">BVN (11 digits)</label>
                  <input x-model="core.bvn" maxlength="11" inputmode="numeric" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                  <p x-show="coreErrors.bvn" x-text="coreErrors.bvn" class="mt-1 text-xs text-rose-300"></p>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Account category</label>
                  <select x-model="core.account_category" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white">
                    <option value="">—</option>
                    <template x-for="opt in accountCategoryOptions" :key="opt.value">
                      <option :value="opt.value" x-text="opt.label"></option>
                    </template>
                  </select>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Applicant signed date</label>
                  <input x-model="core.applicant_signed_date" type="date" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Purpose of account</label>
                  <textarea x-model="core.purpose_of_account" rows="2" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                </div>
              </div>
            </div>

            <!-- Step 1: next of kin (optional, single) -->
            <div x-show="wizardStep === 1" class="space-y-4">
              <button
                type="button"
                @click="hasNextOfKin = !hasNextOfKin"
                class="flex items-center gap-2 text-sm text-slate-300"
              >
                <span
                  class="toggle-track relative inline-flex h-5 w-9 items-center rounded-full"
                  :class="hasNextOfKin ? 'bg-teal-400/80' : 'bg-slate-600/60'"
                >
                  <span
                    class="toggle-thumb inline-block h-3.5 w-3.5 transform rounded-full bg-white shadow"
                    :class="hasNextOfKin ? 'translate-x-[18px]' : 'translate-x-[3px]'"
                  ></span>
                </span>
                This client has a next of kin
              </button>

              <div x-show="hasNextOfKin" class="grid grid-cols-2 gap-3">
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Name *</label>
                  <input x-model="nextOfKin.name" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                  <p x-show="nextOfKinErrors.name" x-text="nextOfKinErrors.name" class="mt-1 text-xs text-rose-300"></p>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Relationship *</label>
                  <input x-model="nextOfKin.relationship" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                  <p x-show="nextOfKinErrors.relationship" x-text="nextOfKinErrors.relationship" class="mt-1 text-xs text-rose-300"></p>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Phone *</label>
                  <input x-model="nextOfKin.phone" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                  <p x-show="nextOfKinErrors.phone" x-text="nextOfKinErrors.phone" class="mt-1 text-xs text-rose-300"></p>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Date of birth</label>
                  <input x-model="nextOfKin.dob" type="date" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Address</label>
                  <textarea x-model="nextOfKin.address" rows="2" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Email</label>
                  <input x-model="nextOfKin.email" type="email" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Occupation</label>
                  <input x-model="nextOfKin.occupation" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Work address</label>
                  <textarea x-model="nextOfKin.work_address" rows="2" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                </div>
              </div>
            </div>

            <!-- Step 2: spouse(s) (optional, repeatable) -->
            <div x-show="wizardStep === 2" class="space-y-5">
              <template x-for="(spouse, i) in spouses" :key="i">
                <div class="rounded-2xl border border-white/10 bg-white/[0.02] p-4">
                  <div class="mb-3 flex items-center justify-between">
                    <p class="text-xs font-semibold uppercase tracking-wider text-teal-300" x-text="'Spouse ' + (i + 1)"></p>
                    <button type="button" @click="removeSpouse(i)" class="text-xs text-slate-500 hover:text-rose-300">Remove</button>
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2 sm:col-span-1">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Name *</label>
                      <input x-model="spouse.name" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Relationship</label>
                      <input x-model="spouse.relationship" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Phone</label>
                      <input x-model="spouse.phone" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Date of birth</label>
                      <input x-model="spouse.dob" type="date" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                    </div>
                    <div class="col-span-2">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">PFA</label>
                      <select x-model.number="spouse.pension_fund_administrator_id" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white">
                        <option value="">—</option>
                        <template x-for="p in pfas" :key="p.id">
                          <option :value="p.id" x-text="p.name"></option>
                        </template>
                      </select>
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">PIN</label>
                      <input x-model="spouse.pin" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Equity contribution</label>
                      <input x-model.number="spouse.equity_contribution" type="number" step="0.01" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                    </div>
                  </div>
                </div>
              </template>

              <button
                type="button"
                @click="addSpouse()"
                class="w-full rounded-xl border border-dashed border-slate-600/60 px-4 py-3 text-sm text-slate-400 transition hover:border-teal-400/40 hover:text-teal-300"
              >
                + Add spouse
              </button>
            </div>

            <!-- Step 3: referees (exactly 2, required) -->
            <div x-show="wizardStep === 3" class="space-y-5">
              <p x-show="refereeErrors.count" x-text="refereeErrors.count" class="text-xs text-rose-300"></p>
              <template x-for="(referee, i) in referees" :key="i">
                <div class="rounded-2xl border border-white/10 bg-white/[0.02] p-4">
                  <p class="mb-3 text-xs font-semibold uppercase tracking-wider text-teal-300" x-text="'Referee ' + referee.referee_number"></p>
                  <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2 sm:col-span-1">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Name *</label>
                      <input x-model="referee.referee_name" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                      <p x-show="refereeErrors['referee_' + i + '_name']" x-text="refereeErrors['referee_' + i + '_name']" class="mt-1 text-xs text-rose-300"></p>
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Known period</label>
                      <input x-model="referee.known_period" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                    </div>
                    <div class="col-span-2">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Current account with</label>
                      <input x-model="referee.current_account_with" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                    </div>
                    <div class="col-span-2">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Bank name &amp; address</label>
                      <textarea x-model="referee.bank_name_address" rows="2" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Referee account number</label>
                      <input x-model="referee.referee_account_number" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                    </div>
                    <div class="col-span-2">
                      <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Suitability comment</label>
                      <textarea x-model="referee.suitability_comment" rows="2" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                    </div>
                  </div>
                </div>
              </template>
            </div>

            <!-- Step 4: equity application (optional — all fields nullable server-side) -->
            <div x-show="wizardStep === 4" class="space-y-4">
              <p class="rounded-xl border border-slate-600/40 bg-white/[0.02] px-4 py-2.5 text-xs text-slate-400">
                Optional — fill in whatever the client has on hand today. Every
                field here can be completed later.
                <span x-show="core && core.server_id === null">
                  It'll sync once the client record itself has synced (it needs
                  a server id first).
                </span>
              </p>

              <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Pension fund administrator</label>
                  <select x-model.number="equityApplication.pension_fund_administrator_id" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white">
                    <option value="">—</option>
                    <template x-for="p in pfas" :key="p.id">
                      <option :value="p.id" x-text="p.name"></option>
                    </template>
                  </select>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">PIN</label>
                  <input x-model="equityApplication.pin" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Mortgage offer type</label>
                  <select x-model="equityApplication.mortgage_offer_type" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white">
                    <option value="">—</option>
                    <template x-for="opt in mortgageOfferTypeOptions" :key="opt.value">
                      <option :value="opt.value" x-text="opt.label"></option>
                    </template>
                  </select>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Mortgage lender name</label>
                  <input x-model="equityApplication.mortgage_lender_name" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Mortgage account number</label>
                  <input x-model="equityApplication.mortgage_account_number" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Mortgage lender address</label>
                  <textarea x-model="equityApplication.mortgage_lender_address" rows="2" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Supplementary mortgage lender</label>
                  <input x-model="equityApplication.supplementary_mortgage_lender" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Property type</label>
                  <input x-model="equityApplication.property_type" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Property address</label>
                  <textarea x-model="equityApplication.property_type_address" rows="2" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                </div>

                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Value of property</label>
                  <input x-model.number="equityApplication.value_of_property" type="number" step="0.01" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Equity per applicant</label>
                  <input x-model.number="equityApplication.equity_per_applicant" type="number" step="0.01" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Amount of equity payable</label>
                  <input x-model.number="equityApplication.amount_of_equity_payable" type="number" step="0.01" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>

                <div class="col-span-2 sm:col-span-1">
                  <p class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Evidence of marriage?</p>
                  <div class="flex gap-2">
                    <button type="button" @click="setEquityBoolField('evidence_of_marriage', true)" class="flex-1 rounded-xl border px-3 py-2 text-xs font-medium transition" :class="equityApplication.evidence_of_marriage === true ? 'border-teal-400/60 bg-teal-400/15 text-teal-300' : 'border-slate-600/50 text-slate-400'">Yes</button>
                    <button type="button" @click="setEquityBoolField('evidence_of_marriage', false)" class="flex-1 rounded-xl border px-3 py-2 text-xs font-medium transition" :class="equityApplication.evidence_of_marriage === false ? 'border-teal-400/60 bg-teal-400/15 text-teal-300' : 'border-slate-600/50 text-slate-400'">No</button>
                    <button type="button" @click="setEquityBoolField('evidence_of_marriage', null)" class="flex-1 rounded-xl border px-3 py-2 text-xs font-medium transition" :class="equityApplication.evidence_of_marriage === null ? 'border-teal-400/60 bg-teal-400/15 text-teal-300' : 'border-slate-600/50 text-slate-400'">Unsure</button>
                  </div>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <p class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Owner-occupier?</p>
                  <div class="flex gap-2">
                    <button type="button" @click="setEquityBoolField('is_owner_occupier', true)" class="flex-1 rounded-xl border px-3 py-2 text-xs font-medium transition" :class="equityApplication.is_owner_occupier === true ? 'border-teal-400/60 bg-teal-400/15 text-teal-300' : 'border-slate-600/50 text-slate-400'">Yes</button>
                    <button type="button" @click="setEquityBoolField('is_owner_occupier', false)" class="flex-1 rounded-xl border px-3 py-2 text-xs font-medium transition" :class="equityApplication.is_owner_occupier === false ? 'border-teal-400/60 bg-teal-400/15 text-teal-300' : 'border-slate-600/50 text-slate-400'">No</button>
                    <button type="button" @click="setEquityBoolField('is_owner_occupier', null)" class="flex-1 rounded-xl border px-3 py-2 text-xs font-medium transition" :class="equityApplication.is_owner_occupier === null ? 'border-teal-400/60 bg-teal-400/15 text-teal-300' : 'border-slate-600/50 text-slate-400'">Unsure</button>
                  </div>
                </div>

                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Occupation</label>
                  <input x-model="equityApplication.occupation" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Present position</label>
                  <input x-model="equityApplication.present_position" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Date employed</label>
                  <input x-model="equityApplication.date_employed" type="date" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Telephone number</label>
                  <input x-model="equityApplication.telephone_no" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Office address</label>
                  <textarea x-model="equityApplication.office_address" rows="2" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                </div>

                <div class="col-span-2">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Purpose of loan</label>
                  <textarea x-model="equityApplication.purpose_of_loan" rows="2" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Loan amount</label>
                  <input x-model.number="equityApplication.loan_amount" type="number" step="0.01" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Repayment period</label>
                  <input x-model="equityApplication.repayment_period" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Monthly salary income</label>
                  <input x-model.number="equityApplication.monthly_salary_income" type="number" step="0.01" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div class="col-span-2">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Source of loan repayment</label>
                  <textarea x-model="equityApplication.source_of_loan_repayment" rows="2" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-400">Declaration date</label>
                  <input x-model="equityApplication.declaration_date" type="date" class="field-input w-full rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
              </div>
            </div>

            <!-- Step 5: review & submit -->
            <div x-show="wizardStep === 5" class="space-y-4 text-sm">
              <div class="rounded-2xl border border-white/10 bg-white/[0.02] p-4">
                <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-teal-300">Client</p>
                <p class="text-white" x-text="[core.first_name, core.middle_name, core.surname].filter(Boolean).join(' ') || 'Untitled client'"></p>
                <p class="text-slate-400" x-text="core.phone_no || 'No phone number'"></p>
              </div>
              <div class="rounded-2xl border border-white/10 bg-white/[0.02] p-4">
                <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-teal-300">Next of kin</p>
                <p class="text-slate-300" x-show="hasNextOfKin" x-text="nextOfKin.name + ' (' + nextOfKin.relationship + ')'"></p>
                <p class="text-slate-500" x-show="!hasNextOfKin">None provided</p>
              </div>
              <div class="rounded-2xl border border-white/10 bg-white/[0.02] p-4">
                <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-teal-300">Spouses</p>
                <p class="text-slate-500" x-show="spouses.length === 0">None</p>
                <p class="text-slate-300" x-show="spouses.length > 0" x-text="spouses.length + ' spouse(s) added'"></p>
              </div>
              <div class="rounded-2xl border border-white/10 bg-white/[0.02] p-4">
                <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-teal-300">Referees</p>
                <p class="text-slate-300" x-text="referees.filter(r => r.referee_name?.trim()).length + ' of 2 named'"></p>
              </div>
              <div class="rounded-2xl border border-white/10 bg-white/[0.02] p-4">
                <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-teal-300">Equity application</p>
                <p class="text-slate-300" x-text="Object.values(equityApplication).some(v => v !== null && v !== '') ? 'Some details provided' : 'Not started — optional, can be added later'"></p>
                <p class="mt-1 text-xs text-slate-500" x-show="core && core.server_id === null">
                  Will sync once this client itself has synced.
                </p>
              </div>
              <p class="text-xs text-slate-500">
                Submitting saves the client locally as ready-to-sync. It will
                upload automatically next time the app is online — you don't
                need to stay connected.
              </p>
            </div>

            <!-- Wizard nav -->
            <div class="mt-6 flex items-center justify-between gap-2">
              <button
                type="button"
                @click="backToDashboard()"
                class="rounded-xl px-3 py-2 text-xs font-medium text-slate-400 transition hover:text-slate-200"
              >
                &larr; All clients
              </button>
              <div class="flex items-center gap-2">
                <button
                  type="button"
                  x-show="wizardStep > 0"
                  @click="prevStep()"
                  class="rounded-xl border border-slate-600/60 px-4 py-2.5 text-sm font-medium text-slate-300 transition hover:border-teal-400/40"
                >
                  Back
                </button>
                <button
                  type="button"
                  x-show="wizardStep < wizardSteps.length - 1"
                  @click="nextStep()"
                  class="btn-primary rounded-xl px-5 py-2.5 text-sm font-semibold"
                >
                  Next
                </button>
                <button
                  type="button"
                  x-show="wizardStep === wizardSteps.length - 1"
                  :disabled="saving"
                  @click="submitClient()"
                  class="btn-primary rounded-xl px-5 py-2.5 text-sm font-semibold"
                >
                  <span x-text="saving ? 'Saving…' : 'Submit client'"></span>
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </body>
</html>
